name: One-time authorized branch cleanup
on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/bib-one-time-branch-cleanup.yml"
permissions:
  contents: write
jobs:
  prune:
    if: github.repository == 'Pheniiix-Ankh-Group-Inc/BiB' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the 26 explicitly approved branch refs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error
          REPO = "Pheniiix-Ankh-Group-Inc/BiB"
          KEEP = set(["develop","feat/premium-art-direction-20261123","main","automation/bib-dependabot-lockfile","fix/bib-vercel-toolbar-preview-csp"])
          TARGET = set(["data/state-of-bib-sync","feat/bib-institutional-five-pages-20261122","feat/startup-spotlight","feature/cron-contract-hardening-20261120","feature/exclude-docs-supabase-from-vercel-20261121","feature/fondateurs-page","feature/runtime-node24-20261120","feature/sob-automation-no-pr-churn-20261120","feature/sob-historical-warehouse-20261117","fix/bib-brand-consistency-20261122","fix/bib-github-environment-scoping-20261117","fix/bib-preproduction-readiness","fix/bib-security-editor-access-20261122","fix/bib-sob-ci-optional-env","fix/bib-supabase-secret-names-20261117","fix/sob-bootstrap-workflow-20261118","fix/sob-historical-delta-backfill-20261118","fix/sob-historical-observation-bulk-shape-20261118","fix/sob-public-visibility-20261120","fix/sob-repo-sync-safe-push-20261118","fix/sob-workflow-finalize-20261118","release/bib-state-luma-2026-11-17","release/sob-historical-targeted-20261118","sync/bib-github-environment-scoping-develop","sync/bib-supabase-secret-names-develop","sync/main-into-develop-20261118"])
          TOKEN = os.environ["GITHUB_TOKEN"]
          assert os.environ["GITHUB_REPOSITORY"] == REPO, "Unexpected repository"
          assert os.environ["GITHUB_REF"] == "refs/heads/develop", "Unexpected triggering branch"
          assert len(KEEP) == 5 and len(TARGET) == 26 and not (KEEP & TARGET)
          HEADERS = {
              "Authorization": "Bearer " + TOKEN,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "BiB-branch-cleanup",
          }
          ROOT = "https://api.github.com/repos/" + REPO
          def request(url, method="GET"):
              req = urllib.request.Request(url, headers=HEADERS, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as err:
                  raise RuntimeError("GitHub API " + method + " failed HTTP " + str(err.code) + " for a branch operation") from err
          def remote_names():
              status, body = request(ROOT + "/branches?per_page=100&page=1")
              names = {b["name"] for b in json.loads(body)}
              assert len(names) < 100, "Pagination guard: refuse incomplete branch inventory"
              return names
          before = remote_names()
          assert KEEP <= before, "Refuse to prune: a protected keep branch is missing"
          assert before <= (KEEP | TARGET), "Refuse to prune: branch inventory contains unexpected names"
          for branch in sorted(before & TARGET):
              url = ROOT + "/git/refs/heads/" + urllib.parse.quote(branch, safe="/")
              status, _ = request(url, "DELETE")
              if status != 204:
                  raise RuntimeError("Unexpected response while deleting branch: HTTP " + str(status))
              print("Deleted:", branch)
          after = remote_names()
          print("Final branches:", sorted(after))
          assert after == KEEP, "Pruning incomplete: final set differs from the 5 approved branches"
          print("SUCCESS: 5 approved branches preserved, all other branches removed")
          PY
