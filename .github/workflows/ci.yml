name: CI — contrôles et tests

# Contrôles statiques, tests unitaires, tests du pipeline et tests SQL/RLS sur
# une base PostgreSQL JETABLE (conteneur de service). Aucun secret requis,
# aucun service externe contacté, aucun déploiement.

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit and security tests (no network)
        run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Dependency audit (production, high and critical)
        run: pnpm audit --prod --audit-level=high
      # Risk acceptance, not remediation: one GHSA, dev tooling only, fixed expiry.
      # This guard fails closed on any additional GHSA allowlist entry, a production
      # dependency path, or a date >= 2026-12-17. See docs/SECURITY.md and #37.
      - name: Temporary picomatch risk exception — expires 2026-12-17
        run: |
          set -euo pipefail
          ghsa="GHSA-fc5q-39xc-vjpf"
          expiry="2026-12-17"
          # Ensure exactly ONE ignored advisory, and it is the reviewed one.
          allowed=$(grep -Ec '^[[:space:]]+- GHSA-' pnpm-workspace.yaml || true)
          if [ "$allowed" -ne 1 ] || ! grep -Fxq "    - $ghsa" pnpm-workspace.yaml; then
            echo "::error title=Audit policy::Only $ghsa may be allowlisted"; exit 1
          fi
          if [[ ! "$(date -u +%Y-%m-%d)" < "$expiry" ]]; then
            echo "::error title=Expired security exception::$ghsa expired $expiry; remove exception and remediate or renew via explicit risk review"; exit 1
          fi
          # A new PRODUCTION path for picomatch is not covered by this waiver.
          pnpm why picomatch --prod --depth 100 > /tmp/picomatch-production-paths.txt
          if [ -s /tmp/picomatch-production-paths.txt ]; then
            cat /tmp/picomatch-production-paths.txt
            echo "::error title=Risk scope changed::picomatch is now in the production dependency graph. Stop release."; exit 1
          fi
          echo "::warning title=Temporary security exception::$ghsa (CVE-2026-112366) remains unresolved in development tooling. Explicit waiver expires $expiry; tracking #37."
      # Full audit still scans all dependencies at Low severity. pnpm 10's
      # auditConfig.ignoreGhsas suppresses ONLY the one reviewed advisory.
      # Any other finding retains its default nonzero exit status.
      - name: Dependency audit (all packages and all severities — scoped exception)
        run: pnpm audit --audit-level=low
      - name: No server secret in the client bundle
        run: |
          if grep -rIl -E "SUPABASE_SECRET_KEY|BREVO_API_KEY|AI_API_KEY|CRON_SECRET|NEWSLETTER_EMAIL_HASH_PEPPER" .next/static 2>/dev/null; then
            echo "Variable serveur référencée dans le bundle client"; exit 1
          fi
      - name: Security headers served by the build
        run: |
          pnpm start -p 3123 >/tmp/next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3123/ && break; sleep 1; done
          headers=$(curl -sI http://localhost:3123/)
          echo "$headers" | grep -qi '^content-security-policy:.*object-src .none.' || { echo "CSP absente ou incomplète"; exit 1; }
          echo "$headers" | grep -qi '^strict-transport-security:' || { echo "HSTS absent"; exit 1; }
          echo "$headers" | grep -i '^strict-transport-security:' | grep -qi 'preload' && { echo "HSTS preload non autorisé"; exit 1; } || true
          echo "$headers" | grep -qi '^x-content-type-options: nosniff' || { echo "nosniff absent"; exit 1; }
          echo "$headers" | grep -qi '^x-powered-by' && { echo "X-Powered-By exposé"; exit 1; } || true

  data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: data-pipeline/requirements.txt
      - run: pip install -r data-pipeline/requirements.txt
      - run: python -m py_compile data-pipeline/*.py
      - run: python data-pipeline/validate.py data/state-of-bib/current
      - name: Archived snapshots integrity (SHA-256)
        run: python data-pipeline/history.py --check
      - name: Pipeline governance tests (no network)
        run: python -m unittest discover -s data-pipeline/tests -v
      - name: SQL migrations parse
        run: |
          pip install pglast==7.*
          python - <<'PY'
          import glob, pglast
          files = sorted(glob.glob("supabase/migrations/*.sql")) + sorted(glob.glob("supabase/bootstrap/*.sql"))
          for f in files:
              pglast.parse_sql(open(f).read())
              print("OK", f)
          PY

  sql:
    # Migrations sur base vierge + matrice RLS + intégrité transactionnelle.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17  # même version majeure que Supabase
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migrations and RLS tests on a throwaway database
        env:
          PGURL: postgresql://postgres:postgres@localhost:5432/postgres
        run: bash supabase/tests/run.sh
