name: CI — contrôles et tests

# Contrôles statiques, tests unitaires, tests du pipeline et tests SQL/RLS sur
# une base PostgreSQL JETABLE (conteneur de service). Aucun secret requis,
# aucun service externe contacté, aucun déploiement.

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit and security tests (no network)
        run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Dependency audit (production, high and critical)
        run: pnpm audit --prod --audit-level=high
      - name: No server secret in the client bundle
        run: |
          if grep -rIl -E "SUPABASE_SECRET_KEY|BREVO_API_KEY|AI_API_KEY|CRON_SECRET|NEWSLETTER_EMAIL_HASH_PEPPER" .next/static 2>/dev/null; then
            echo "Variable serveur référencée dans le bundle client"; exit 1
          fi
      - name: Security headers served by the build
        run: |
          pnpm start -p 3123 >/tmp/next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3123/ && break; sleep 1; done
          headers=$(curl -sI http://localhost:3123/)
          echo "$headers" | grep -qi '^content-security-policy:.*object-src .none.' || { echo "CSP absente ou incomplète"; exit 1; }
          echo "$headers" | grep -qi '^strict-transport-security:' || { echo "HSTS absent"; exit 1; }
          echo "$headers" | grep -qi 'preload' && { echo "HSTS preload non autorisé"; exit 1; } || true
          echo "$headers" | grep -qi '^x-content-type-options: nosniff' || { echo "nosniff absent"; exit 1; }
          echo "$headers" | grep -qi '^x-powered-by' && { echo "X-Powered-By exposé"; exit 1; } || true

  data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: data-pipeline/requirements.txt
      - run: pip install -r data-pipeline/requirements.txt
      - run: python -m py_compile data-pipeline/*.py
      - run: python data-pipeline/validate.py public/data
      - name: Pipeline governance tests (no network)
        run: python -m unittest discover -s data-pipeline/tests -v
      - name: SQL migrations parse
        run: |
          pip install pglast==7.*
          python - <<'PY'
          import glob, pglast
          files = sorted(glob.glob("supabase/migrations/*.sql")) + sorted(glob.glob("supabase/bootstrap/*.sql"))
          for f in files:
              pglast.parse_sql(open(f).read())
              print("OK", f)
          PY

  sql:
    # Migrations sur base vierge + matrice RLS + intégrité transactionnelle.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migrations and RLS tests on a throwaway database
        env:
          PGURL: postgresql://postgres:postgres@localhost:5432/postgres
        run: bash supabase/tests/run.sh
