name: TEMP — check BIB dataset Parquet schema
on:
  push:
    branches: [automation/bib-dependabot-lockfile]
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r data-pipeline/requirements.txt
      - name: Read live source schema (no records persisted)
        env:
          PYTHONPATH: data-pipeline
        run: |
          python - <<'PY'
          from source_manifest import fetch_manifest, table_resources, SOB_TABLES, verify_resources
          from build_data import open_connection, resolve_schema, log_schemas
          m=fetch_manifest()
          resources=table_resources(m,SOB_TABLES)
          print("Manifest version:",m["dataset"]["version"])
          for k,v in resources.items():
              print("SOURCE",k,"size_bytes",v["size_bytes"],"urlhost",v["url"].split("/")[2])
          issues=verify_resources(resources)
          if issues: raise RuntimeError("Source integrity issues: "+str(issues))
          con=open_connection(resources)
          log_schemas(con)
          print("Resolved source schema:",resolve_schema(con))
          PY
      - name: Build complete source-derived BIB snapshot (no database writes)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python data-pipeline/build_data.py --output-dir /tmp/bib-sob-generated
          python data-pipeline/validate.py /tmp/bib-sob-generated
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("/tmp/bib-sob-generated")
          x=json.loads((p/"headline.json").read_text())
          print("VALIDATED SOURCE SNAPSHOT",x)
          print("Artifacts",sorted(f.name for f in p.glob("*.json")))
          PY
