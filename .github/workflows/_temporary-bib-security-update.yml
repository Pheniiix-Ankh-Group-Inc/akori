# TEMPORARY: generate a security-updated dependency lockfile using GitHub runner.
# This workflow lives exclusively on automation/bib-dependabot-lockfile and
# MUST NEVER be merged into develop/main. Copy the generated package and
# lockfile blob SHAs to the security PR after reviewing its audit results.
name: TEMP — regenerate BIB secure dependency lockfile
on:
  push:
    branches: [automation/bib-dependabot-lockfile]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Resolve patched direct development dependencies
        run: |
          set -euo pipefail
          pnpm update --lockfile-only --dev happy-dom@21.0.4 vitest@5.1.0
          pnpm update --lockfile-only --dev eslint@^9 @tailwindcss/postcss@^4
          pnpm install --lockfile-only
          git diff --stat -- package.json pnpm-lock.yaml pnpm-workspace.yaml
          git diff -- package.json | head -90
      - name: Commit generated dependency graph on isolated temporary branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml pnpm-workspace.yaml
          if git diff --cached --quiet; then
            echo "::warning::No updates available"
            exit 0
          fi
          git commit -m "chore(security): upgrade patched dev tooling and lockfile"
          git push origin HEAD:automation/bib-dependabot-lockfile
      - name: Summarize result
        run: |
          printf '%s\n' "Generated manifest + lockfile committed to temporary branch." >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "No dependency audit has been bypassed. The resulting graph must pass the original PR's full audit." >> "$GITHUB_STEP_SUMMARY"
