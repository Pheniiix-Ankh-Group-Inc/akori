# TEMPORARY and isolated: regenerate a vetted transitive security update.
# NEVER merge this workflow; copy only pnpm-workspace.yaml and pnpm-lock.yaml.
name: TEMP — resolve minimatch CVE-2026-118764
on:
  push:
    branches: [automation/bib-dependabot-lockfile]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Resolve patched minimatch transitive dependency
        run: |
          set -euo pipefail
          pnpm install --lockfile-only
          grep -n "minimatch@" pnpm-lock.yaml | head -10
      - name: Commit regenerated lockfile only in isolated branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-workspace.yaml pnpm-lock.yaml
          git commit -m "chore(security): resolve patched minimatch 11 in eslint toolchain"
          git push origin HEAD:automation/bib-dependabot-lockfile
