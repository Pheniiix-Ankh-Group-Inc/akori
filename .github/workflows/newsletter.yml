name: Newsletter BIB — cycle hebdomadaire

# Déclenche les étapes du cycle autonome sur le site déployé :
#   lundi    → generate (rédaction FR/EN + contrôles)
#   mardi    → check    (recontrôle, régénération bornée)
#   mercredi → send     (09:00–09:59 America/Toronto ; deux créneaux UTC
#                        couvrent l'heure d'été et l'heure normale, l'application
#                        décide selon l'heure réelle de Toronto)
#
# DÉSACTIVÉ PAR DÉFAUT : rien ne s'exécute tant que la variable de dépôt
# BIB_SCHEDULES_ENABLED n'est pas égale à "true". L'envoi réel exige en plus
# FEATURE_NEWSLETTER_AUTOSEND=true côté application. Voir docs/DEPLOYMENT.md.

on:
  schedule:
    - cron: "11 13 * * 1" # lundi
    - cron: "11 13 * * 2" # mardi
    - cron: "2 13 * * 3"  # mercredi 09:02 heure d'été (EDT)
    - cron: "2 14 * * 3"  # mercredi 09:02 heure normale (EST)
    # Créneaux planifiés par l'équipe (/admin/newsletter) : vérification toutes
    # les 15 min du mercredi au dimanche ; sans planification, « send » ne fait
    # rien avant le créneau standard et reste idempotent après.
    - cron: "*/15 * * * 0,3-6"
  workflow_dispatch:
    inputs:
      step:
        description: "Étape à exécuter"
        type: choice
        options: [generate, check, send]
        required: true

permissions:
  contents: read

concurrency:
  group: bib-newsletter
  cancel-in-progress: false

jobs:
  trigger:
    # Resolve variables and secrets from the GitHub production Environment.
    environment: production
    # Planification désactivable ; le déclenchement manuel reste toujours possible.
    # Do not access environment-level vars in job.if: it is evaluated before environment attachment.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify BIB scheduling flag in selected environment
        if: github.event_name != 'workflow_dispatch'
        env:
          BIB_ENABLED: ${{ vars.BIB_SCHEDULES_ENABLED }}
        run: |
          [ "$BIB_ENABLED" = "true" ] || { echo "::error title=BIB schedules::BIB_SCHEDULES_ENABLED must equal true in GitHub Environment production or Repository variables."; exit 78; }
      - name: Determine step
        id: step
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "step=${{ inputs.step }}" >> "$GITHUB_OUTPUT"
          else
            case "$(date -u +%u)" in
              1) echo "step=generate" >> "$GITHUB_OUTPUT" ;;
              2) echo "step=check" >> "$GITHUB_OUTPUT" ;;
              *) echo "step=send" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Call the site
        if: steps.step.outputs.step != ''
        env:
          PROD_SITE_URL: ${{ vars.BIB_SITE_URL }}
          PROD_CRON_SECRET: ${{ secrets.BIB_CRON_SECRET }}
          MANUAL_SITE_URL: ${{ vars.BIB_STAGING_SITE_URL }}
          MANUAL_CRON_SECRET: ${{ secrets.BIB_STAGING_CRON_SECRET }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$TRIGGER" = "workflow_dispatch" ]; then
            SITE_URL="$MANUAL_SITE_URL"
            CRON_SECRET="$MANUAL_CRON_SECRET"
            test -n "$SITE_URL" || { echo "::error::Manual workflow requires BIB_STAGING_SITE_URL"; exit 78; }
          else
            SITE_URL="$PROD_SITE_URL"
            CRON_SECRET="$PROD_CRON_SECRET"
          fi
          case "$SITE_URL" in https://*) ;; *) echo "::error::HTTPS required"; exit 78 ;; esac
          test -n "$SITE_URL" || { echo "BIB_SITE_URL manquant"; exit 1; }
          test -n "$CRON_SECRET" || { echo "BIB_CRON_SECRET manquant"; exit 1; }
          export SITE_URL="${SITE_URL%/}" CRON_SECRET
          python scripts/run_cron.py --kind newsletter --step "${{ steps.step.outputs.step }}"
