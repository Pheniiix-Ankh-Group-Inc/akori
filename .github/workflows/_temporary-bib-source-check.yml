name: TEMP — check BIB public source access
on:
  push:
    branches: [automation/bib-dependabot-lockfile]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Luma iCal source without credentials or writes
        run: |
          python - <<'PY'
          import urllib.request, re, datetime, collections
          u="https://api.lu.ma/ics/get?entity=calendar&id=cal-aqEzCpUP5LXSBcL"
          req=urllib.request.Request(u,headers={"Accept":"text/calendar","User-Agent":"BlackInBlockchain-SourceCheck/1.0"})
          try:
              with urllib.request.urlopen(req,timeout=45) as r:
                  data=r.read(12*1024*1024+1)
                  print("Luma HTTP",r.status,"finalHost",r.url.split("/")[2],"bytes",len(data),"mime",r.headers.get("Content-Type"))
              if len(data)>12*1024*1024: raise ValueError("feed >12MB")
              s=data.decode("utf-8-sig")
              count=s.count("BEGIN:VEVENT")
              years=collections.Counter(re.findall(r"(?m)^DTSTART(?:;[^:]+)?:([0-9]{4})[0-9]{4}",s))
              print("Luma VEVENT entries",count,"years",sorted(years.items()),"BEGIN:VCALENDAR",s.lstrip().startswith("BEGIN:VCALENDAR"),"END:VCALENDAR","END:VCALENDAR" in s)
              if not s.lstrip().startswith("BEGIN:VCALENDAR"): raise ValueError("not calendar")
          except Exception as e:
              print("Luma source check failed:",type(e).__name__,str(e)[:300])
              raise
          PY
      - name: Check State of BIB manifest without credentials
        run: |
          python - <<'PY'
          import urllib.request,json
          u="https://data.opendevdata.org/manifest.json"
          try:
              with urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"BlackInBlockchain-SourceCheck/1.0"}),timeout=45) as r:
                  b=r.read(2*1024*1024+1)
                  print("SOB manifest HTTP",r.status,"bytes",len(b))
              o=json.loads(b)["dataset"]
              resources=o["resources"]
              print("SOB version",o["version"],"resources",len(resources))
              required={"ecosystems.parquet","canonical_developer_locations.parquet","canonical_developers.parquet","eco_mads.parquet","eco_developer_activities.parquet","developer_activities.parquet"}
              names={r["path"].split("/")[-1] for r in resources}
              missing=required-names
              print("SOB required resource paths missing", sorted(missing))
              if missing: raise ValueError("manifest missing resources")
          except Exception as e:
              print("SOB manifest source check failed:",type(e).__name__,str(e)[:300])
              raise
          PY
