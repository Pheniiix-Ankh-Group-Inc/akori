name: State of BIB — pipeline automatique

# Fonctionnement ENTIÈREMENT AUTOMATIQUE, sans approbation humaine :
#
#   check    (toutes les heures, léger) lit le manifeste de la source et compare
#            version + empreinte des ressources. Rien n'est retéléchargé si rien
#            n'a changé. SOB_CHECK_INTERVAL_HOURS espace les lectures.
#   build    (seulement si nécessaire) construit, valide et ingère le lot ;
#            en mode « auto », une version valide est publiée et vérifiée.
#            Une forte variation passe des contrôles renforcés automatiques ;
#            un lot non confirmé est mis en quarantaine et retenté plus tard.
#   finalize (à chaque exécution) publie une candidate restée en attente,
#            réconcilie PostgreSQL / Storage / dépôt, actualise le site
#            (caches invalidés, version servie vérifiée) et lance les analyses IA.
#   repo-sync propose une copie technique par PR, sans fusion dans main.
#            La publication Supabase reste autonome et indépendante de cette PR.
#
# Identité : rôle de service Supabase et secret des tâches planifiées. Aucun
# compte administrateur, aucune session utilisateur.
#
# Activation : variable BIB_SCHEDULES_ENABLED = "true" (les exécutions
# planifiées ne font rien sinon ; le déclenchement manuel reste possible).
# Une configuration incomplète fait ÉCHOUER le workflow : jamais de faux succès.
# Voir docs/SOB_AUTOMATION.md.

on:
  # Kick off initial ingestion automatically when the release reaches main,
  # rather than waiting for the first hourly scheduled check.
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *" # toutes les heures, à la minute 7
  workflow_dispatch:
    inputs:
      force_build:
        description: "Forcer la reconstruction même sans nouvelle version"
        type: boolean
        default: false
      backfill_history:
        description: "Importer toutes les archives locales dans Supabase AVANT de vérifier la source (idempotent)"
        type: boolean
        default: false

# Une seule exécution à la fois ; les suivantes attendent (jamais annulées en cours).
concurrency:
  group: state-of-bib-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    # Resolve variables and secrets from the GitHub production Environment.
    environment: production
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needs_build: ${{ steps.check.outputs.needs_build }}
      version: ${{ steps.check.outputs.version }}
      reason: ${{ steps.check.outputs.reason }}
      checked: ${{ steps.check.outputs.checked }}
    steps:
      - name: Verify BIB schedule configuration (never silently skip)
        if: github.event_name != 'workflow_dispatch'
        env:
          BIB_ENABLED: ${{ vars.BIB_SCHEDULES_ENABLED }}
        run: |
          [ "$BIB_ENABLED" = "true" ] || { echo "::error title=BIB schedules::BIB_SCHEDULES_ENABLED must be exactly true in GitHub Environment production or Repository variables."; exit 78; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Vérification légère : une seule dépendance, aucun téléchargement de données.
      - run: pip install "requests>=2.31,<3"

      - name: Preflight — configuration requise
        env:
          SOB_SUPABASE_SYNC: ${{ vars.SOB_SUPABASE_SYNC }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://zwfyuhgnbdrjhetkyanj.supabase.co' }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          [ "$SOB_SUPABASE_SYNC" = "true" ] || missing="$missing SOB_SUPABASE_SYNC(=true)"
          [ -n "$SUPABASE_URL" ] || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_SECRET_KEY" ] || missing="$missing SUPABASE_SECRET_KEY"
          # Website settings are validated after the database is published.
          if [ -n "$missing" ]; then
            echo "::error title=State of BIB::configuration manquante :$missing — le pipeline automatique ne peut pas fonctionner."
            exit 78
          fi

      # Bootstrap one time on an explicitly marked release, or on manual demand.
      # Import is idempotent; no published/current pointer is changed.
      # This must run BEFORE check_version, or previously known source versions
      # could be skipped without their old snapshots being archived.
      - name: Import historical State of BIB snapshots (explicit bootstrap)
        if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[sob-bootstrap]')) || (github.event_name == 'workflow_dispatch' && inputs.backfill_history)
        working-directory: data-pipeline
        env:
          SOB_SUPABASE_SYNC: ${{ vars.SOB_SUPABASE_SYNC }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://zwfyuhgnbdrjhetkyanj.supabase.co' }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python backfill_history.py --apply

      - id: check
        working-directory: data-pipeline
        env:
          SOB_FORCE_BUILD: ${{ inputs.force_build && 'true' || 'false' }}
          SOB_SUPABASE_SYNC: ${{ vars.SOB_SUPABASE_SYNC }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://zwfyuhgnbdrjhetkyanj.supabase.co' }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SOB_CHECK_INTERVAL_HOURS: ${{ vars.SOB_CHECK_INTERVAL_HOURS }}
          SOB_MAX_FAILED_ATTEMPTS: ${{ vars.SOB_MAX_FAILED_ATTEMPTS }}
          SOB_MAX_BLOCKED_ATTEMPTS: ${{ vars.SOB_MAX_BLOCKED_ATTEMPTS }}
          SOB_BLOCKED_RETRY_HOURS: ${{ vars.SOB_BLOCKED_RETRY_HOURS }}
        run: |
          # Reprise bornée d'une indisponibilité passagère de la source.
          for attempt in 1 2 3; do
            if python check_version.py; then exit 0; fi
            echo "Vérification en échec (tentative $attempt/3)."
            [ "$attempt" -lt 3 ] && sleep $((attempt * 30))
          done
          echo "::error title=State of BIB::source inaccessible après 3 tentatives ; nouvelle vérification à la prochaine heure."
          exit 1

  build:
    # Resolve variables and secrets from the GitHub production Environment.
    environment: production
    needs: check
    if: needs.check.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: data-pipeline/requirements.txt
      - run: pip install -r data-pipeline/requirements.txt

      # build_data.py lit les ressources annoncées par le manifeste, contrôle
      # leur intégrité, recalcule indépendamment les totaux et valide le lot
      # avant de l'écrire (espace de travail du job uniquement).
      - name: Build and validate data
        working-directory: data-pipeline
        env:
          SOB_VERIFY_B3: ${{ vars.SOB_VERIFY_B3 }}
        run: python build_data.py --version "${{ needs.check.outputs.version }}"

      # Ingestion : rapport de validation, contrôles renforcés si forte
      # variation, publication automatique (mode auto) et vérification.
      - name: Ingest, publish and verify
        working-directory: data-pipeline
        env:
          SOB_STRONG_VARIATION: ${{ vars.SOB_STRONG_VARIATION }}
          SOB_SUPABASE_SYNC: ${{ vars.SOB_SUPABASE_SYNC }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://zwfyuhgnbdrjhetkyanj.supabase.co' }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python publish_supabase.py ingest

  # Toujours exécuté après une vérification réussie, que des données aient été
  # traitées ou non : rattrape tout ce qui serait resté en attente.
  finalize:
    # Resolve variables and secrets from the GitHub production Environment.
    environment: production
    needs: [check, build]
    if: always() && needs.check.result == 'success' && needs.check.outputs.checked != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      current_version: ${{ steps.reconcile.outputs.current_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "requests>=2.31,<3"

      # Candidate validée mais non publiée (préparée en mode review, ou
      # exécution interrompue) : publiée automatiquement en mode auto.
      - name: Publish any pending validated candidate
        working-directory: data-pipeline
        env:
          SOB_SUPABASE_SYNC: ${{ vars.SOB_SUPABASE_SYNC }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://zwfyuhgnbdrjhetkyanj.supabase.co' }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python publish_supabase.py publish-pending

      - id: reconcile
        name: Reconcile PostgreSQL / Storage / repository
        working-directory: data-pipeline
        env:
          SOB_SUPABASE_SYNC: ${{ vars.SOB_SUPABASE_SYNC }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://zwfyuhgnbdrjhetkyanj.supabase.co' }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          python publish_supabase.py reconcile
          rc=$?
          # The Git repository copy is optional; nonzero means a real failure.
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

      # Actualisation du site : caches invalidés, version servie VÉRIFIÉE,
      # analyses IA générées et publiées. Reprises bornées (déploiement en cours…).
      - name: Refresh the site and run the insights cycle
        env:
          SITE_URL: ${{ vars.BIB_SITE_URL }}
          CRON_SECRET: ${{ secrets.BIB_CRON_SECRET }}
          VERSION: ${{ steps.reconcile.outputs.current_version }}
        run: |
          # Database ingestion must not be blocked by website refresh settings.
          [ -n "$SITE_URL" ] || { echo "::error title=State of BIB::BIB_SITE_URL missing; dataset may already be published."; exit 78; }
          [ -n "$CRON_SECRET" ] || { echo "::error title=State of BIB::BIB_CRON_SECRET missing; dataset may already be published."; exit 78; }
          case "$SITE_URL" in https://*) ;; *) echo "::error title=State of BIB::BIB_SITE_URL must be HTTPS"; exit 78 ;; esac
          url="${SITE_URL%/}/api/cron/sob-refresh"
          [ -n "$VERSION" ] && url="$url?version=$VERSION"
          for attempt in 1 2 3; do
            code=$(curl -sS -o response.json -w '%{http_code}' --max-time 170 -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" "$url" || echo 000)
            echo "Tentative $attempt : HTTP $code"
            cat response.json 2>/dev/null || true; echo
            if [ "$code" = "200" ]; then exit 0; fi
            # 401 / 503 : configuration — inutile de réessayer.
            if [ "$code" = "401" ] || [ "$code" = "503" ]; then break; fi
            [ "$attempt" -lt 3 ] && sleep $((attempt * 45))
          done
          if [ -z "$VERSION" ] && [ "$code" = "409" ]; then
            echo "::notice title=State of BIB::aucune version publiée pour le moment : rien à afficher."
            exit 0
          fi
          echo "::error title=State of BIB::le site n'a pas confirmé la version ${VERSION:-courante} (HTTP $code)."
          exit 1

      - name: Verify actual public State of BIB figures (EN + FR + homepage)
        if: steps.reconcile.outputs.current_version != ''
        env:
          SITE_URL: ${{ vars.BIB_SITE_URL }}
          VERSION: ${{ steps.reconcile.outputs.current_version }}
        run: |
          python scripts/verify_sob_public.py --site-url "${SITE_URL%/}" --version "$VERSION"

