name: State of BIB — contrôle quotidien et historisation

# Contrôle LÉGER quotidien d'une nouvelle version Electric Capital, puis
# traitement lourd (Python + DuckDB) UNIQUEMENT si nécessaire.
#
# Désactivé par défaut : les exécutions planifiées ne font rien tant que la
# variable de dépôt BIB_SCHEDULES_ENABLED n'est pas égale à "true".
# Gouvernance : ce workflow ne pousse JAMAIS sur main. Les JSON régénérés
# sont proposés dans une branche dédiée data/state-of-bib-<version> avec une
# pull request à relire et fusionner par une personne.
# L'historisation Supabase ne s'exécute que si SOB_SUPABASE_SYNC = "true" et
# que les secrets SUPABASE_URL / SUPABASE_SECRET_KEY (projet BIB) existent.
# Voir docs/DEPLOYMENT.md.

on:
  schedule:
    - cron: "17 7 * * *" # tous les jours, 07:17 UTC
  workflow_dispatch:
    inputs:
      force_build:
        description: "Forcer la reconstruction même sans nouvelle version"
        type: boolean
        default: false

concurrency:
  group: state-of-bib-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || vars.BIB_SCHEDULES_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.check.outputs.needs_build }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: data-pipeline/requirements.txt
      - run: pip install -r data-pipeline/requirements.txt
      - id: check
        working-directory: data-pipeline
        env:
          SOB_SUPABASE_SYNC: ${{ vars.SOB_SUPABASE_SYNC }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SOB_FORCE_BUILD: ${{ inputs.force_build && 'true' || 'false' }}
        run: python check_version.py

  build:
    needs: check
    if: needs.check.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # branche dédiée data/… uniquement, jamais main
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: data-pipeline/requirements.txt
      - run: pip install -r data-pipeline/requirements.txt

      # build_data.py écrit dans un dossier temporaire et valide le lot avant
      # de remplacer public/data. Si le job échoue, rien n'est proposé : la
      # cohérence du lot est garantie par le commit unique de la PR.
      - name: Build and validate data
        working-directory: data-pipeline
        run: python build_data.py --version "${{ needs.check.outputs.version }}"

      - name: Historise in Supabase BIB (optional)
        working-directory: data-pipeline
        env:
          SOB_SUPABASE_SYNC: ${{ vars.SOB_SUPABASE_SYNC }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python publish_supabase.py

      # Les JSON embarqués (compatibilité du site actuel) sont proposés par
      # pull request ; aucune écriture directe sur la branche par défaut.
      - name: Propose refreshed JSON in a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if git diff --quiet -- public/data/; then
            echo "No data changes."
            exit 0
          fi
          BRANCH="data/state-of-bib-${VERSION}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "La branche $BRANCH existe déjà : aucune nouvelle proposition."
            exit 0
          fi
          git config user.name  "bib-data-bot"
          git config user.email "bib-data-bot@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add public/data/
          git commit -m "data: State of BIB snapshot ${VERSION}"
          git push origin "$BRANCH"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
            --title "data: State of BIB snapshot ${VERSION}" \
            --body "Données State of BIB régénérées et validées (validate.py) pour la version source ${VERSION}. À relire avant fusion ; aucune écriture directe sur la branche par défaut."
