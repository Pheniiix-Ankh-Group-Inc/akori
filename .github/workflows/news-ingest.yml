name: Veille actualités BIB — quotidienne

# Collecte légère des flux RSS/Atom des sources AUTORISÉES (sans IA).
# Désactivé par défaut : nécessite BIB_SCHEDULES_ENABLED=true (variable de
# dépôt) et FEATURE_NEWS_INGEST=true côté application.

on:
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ingest:
    # Resolve variables and secrets from the GitHub production Environment.
    environment: production
    # Planification désactivable ; le déclenchement manuel reste toujours possible.
    # Do not access environment-level vars in job.if: it is evaluated before environment attachment.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify BIB scheduling flag in selected environment
        if: github.event_name != 'workflow_dispatch'
        env:
          BIB_ENABLED: ${{ vars.BIB_SCHEDULES_ENABLED }}
        run: |
          [ "$BIB_ENABLED" = "true" ] || { echo "::error title=BIB schedules::BIB_SCHEDULES_ENABLED must equal true in GitHub Environment production or Repository variables."; exit 78; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Call the site
        env:
          PROD_SITE_URL: ${{ vars.BIB_SITE_URL }}
          PROD_CRON_SECRET: ${{ secrets.BIB_CRON_SECRET }}
          MANUAL_SITE_URL: ${{ vars.BIB_STAGING_SITE_URL }}
          MANUAL_CRON_SECRET: ${{ secrets.BIB_STAGING_CRON_SECRET }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$TRIGGER" = "workflow_dispatch" ]; then
            SITE_URL="$MANUAL_SITE_URL"
            CRON_SECRET="$MANUAL_CRON_SECRET"
            test -n "$SITE_URL" || { echo "::error::Manual workflow requires BIB_STAGING_SITE_URL"; exit 78; }
          else
            SITE_URL="$PROD_SITE_URL"
            CRON_SECRET="$PROD_CRON_SECRET"
          fi
          case "$SITE_URL" in https://*) ;; *) echo "::error::HTTPS required"; exit 78 ;; esac
          test -n "$SITE_URL" || { echo "BIB_SITE_URL manquant"; exit 1; }
          test -n "$CRON_SECRET" || { echo "BIB_CRON_SECRET manquant"; exit 1; }
          export SITE_URL="${SITE_URL%/}" CRON_SECRET
          python scripts/run_cron.py --kind news
