# Workflow ponctuel de maintenance : se supprime du dépôt après succès.
# Aucun secret applicatif, aucune migration ni déploiement.
name: BIB refresh pnpm lockfile (one time)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bib-refresh-lock-once.yml'

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/bib-architecture-cible-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve lockfile with scripts disabled
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit lockfile and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bib-refresh-lock-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/bib-refresh-lock-once.yml
          git diff --cached --quiet && exit 1
          git commit -m "chore(bib): regenerate pnpm lockfile"
          git push origin HEAD:refs/heads/feature/bib-architecture-cible-complete
